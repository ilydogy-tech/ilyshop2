<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ILY Shop · Admin Café</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="gingham"></div><header class="top"><a class="brand" href="index.html"><span class="brand-icon">୨୧</span><span>ILY <small>ADMIN</small></span></a><nav><a href="index.html">← View shop</a></nav><button id="logout" class="cart-button" hidden>Log out</button></header><main class="section" style="min-height:70vh;padding-top:30px"><section id="loginPanel" class="status-card" style="max-width:480px;margin:auto"><div class="eyebrow">STAFF ONLY</div><h2>Welcome back ♡</h2><p>เข้าสู่ระบบสำหรับแอดมิน ILY Shop</p><form id="loginForm" class="status-form" style="flex-direction:column"><input id="email" type="email" required autocomplete="username" placeholder="Admin email"><input id="password" type="password" required autocomplete="current-password" placeholder="Password"><button class="primary">Log in ✧</button></form></section><section id="adminPanel" hidden><div class="section-heading"><div><div class="eyebrow">YOUR LITTLE CONTROL ROOM</div><h2>Admin dashboard ♡</h2></div><button id="reload" class="secondary">Refresh</button></div><div id="adminStats" class="welcome-strip"></div><div class="status-card" style="text-align:left;margin-bottom:24px"><h2 style="font-size:22px">Add / edit product</h2><form id="productForm" class="status-form" style="max-width:none;flex-wrap:wrap"><input id="productId" type="hidden"><input id="productName" required maxlength="120" placeholder="Product name" style="flex:1 1 220px"><input id="productPrice" type="number" required min="0" step="0.01" placeholder="Price (THB)" style="flex:1 1 130px"><input id="productCategory" required maxlength="60" placeholder="Category" style="flex:1 1 150px"><input id="productImage" type="url" placeholder="Image URL (optional)" style="flex:1 1 250px"><input id="productDescription" placeholder="Description" style="flex:1 1 100%"><label style="display:flex;gap:8px;align-items:center;font-size:12px"><input id="productActive" type="checkbox" checked style="width:auto"> Active</label><button class="primary" type="submit">Save product ♡</button><button class="secondary" id="resetProduct" type="button">Clear</button></form></div><h2>Orders ♡</h2><div id="ordersList" class="product-grid" style="grid-template-columns:1fr;gap:12px"></div><h2 style="margin-top:35px">Products ♡</h2><div id="adminProducts" class="product-grid"></div></section></main><footer>Private admin area · ILY Shop ♡</footer><div id="toast" role="status" class="toast"></div><script src="config.js"></script><script src="admin.js"></script></body></html>
